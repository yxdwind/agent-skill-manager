name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    # Single runner: lint is CPU-bound, doesn't need the OS matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        # Pinned to the exact version .pre-commit-config.yaml uses - ruff
        # adds rules between releases, so a floating range here would let
        # "green locally (pre-commit)" fail in CI (or vice versa).
        run: pip install "ruff==0.16.9"

      - name: Run ruff
        run: ruff check src tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + mypy
        # `pip install -e .` exposes ``agent_skill_manager`` so mypy can
        # follow the src-layout imports without an explicit mypy_path.
        # Pinned to match .pre-commit-config.yaml (see ruff note above).
        run: |
          pip install -e .
          pip install "mypy==1.14.1"

      - name: Run mypy
        run: mypy src

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      - name: Install pytest
        # annotate plugin turns pytest failures into check-run annotations
        # (readable via API even when job logs are unavailable)
        run: pip install pytest pytest-github-actions-annotate-failures

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest tests -q
