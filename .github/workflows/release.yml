name: Publish to PyPI

# Triggers on tag push only. A GitHub *release* is created after the tag is
# pushed (see the release step in the local release flow); publishing on both
# `release: published` and `push: tags` would fire two runs, and the second
# fails with a "version already exists" 409 on PyPI. `workflow_dispatch`
# remains for manual re-runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
