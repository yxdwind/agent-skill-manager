[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-skill-sync"
version = "0.14.0"
description = "Cross-platform (macOS/Windows/Linux) skill management for 15 domestic AI agent products"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Albert", email = "yxdwind@126.com"},
]
keywords = ["agent", "agent-skills", "skill", "sync", "autoclaw", "kimi", "minimax", "workbuddy", "trae", "dumate", "codebuddy", "comate", "qoder", "qwenwork", "doubaowork", "zcode", "cli", "security-audit", "skills-sh", "linux", "inotify", "fs-events"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.scripts]
askill = "agent_skill_manager.controllers.cli:main"

[project.urls]
Homepage = "https://github.com/yxdwind/agent-skill-manager"
Repository = "https://github.com/yxdwind/agent-skill-manager"
Documentation = "https://github.com/yxdwind/agent-skill-manager#readme"

[project.optional-dependencies]
# Dev tooling only - the published wheel stays zero-dependency.
# Install with: pip install -e ".[dev]"
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "commitizen>=3.0",
    "pre-commit>=3.5",
]

[tool.setuptools]
package-dir = {"agent_skill_manager" = "src"}
packages = [
    "agent_skill_manager",
    "agent_skill_manager.config",
    "agent_skill_manager.controllers",
    "agent_skill_manager.models",
    "agent_skill_manager.services",
    "agent_skill_manager.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".pytest-tmp", ".pytest-tmp-run", "tests/fixtures"]

[tool.ruff.lint]
# Curated rule set: style + correctness + modernisation. Excludes:
# - E501: line length (formatter handles); ruff without a formatter
#         would otherwise flag everything long.
# - PLW1510: subprocess.run without check=... — intentional probe-and-
#         fallback in fs-event backend probes and CLI install pipelines.
# - BLE001 / S110: blind ``except Exception`` / try-except-pass — used
#         deliberately in best-effort code paths (settings.json writes,
#         source-tracking updates) that must never crash user flows.
# - COM812/ISC001: conflict with the project's multi-line string style.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PIE", # flake8-pie
    "RUF", # ruff-specific
    "FURB",# refurb
    "ISC", # implicit string concat
]
ignore = [
    "E501",
    "PLW1510",
    "BLE001",
    "S110",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# Test files routinely use a MagicMock() result that's never referenced,
# or unpack ``success, method, msg`` and only use one element. That is
# intentional — the unused names document the return shape.
# E702 (multiple statements on one line) is also allowed in tests: many
# fixture builders intentionally compress trivial one-liners via ``;``.
"tests/**/*.py" = [
    "F841",
    "RUF059",
    "UP031",
    "E702",
]

# ---------------------------------------------------------------- commitizen
# Conventional Commits enforcement + CHANGELOG generator. Used by
# contributors via ``cz commit`` and by maintainers via ``cz bump`` to
# bump version + regenerate CHANGELOG.md in lockstep.
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.14.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml",
    "src/__init__.py",
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
allow_untyped_calls = true
allow_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_decorators = false
# The watcher backends use ctypes + select.KQ_NOTE_*/kqueue/platform-specific
# OS attributes that mypy can't model across macOS / Linux / Windows. The
# runtime guards via platform.system() make this safe; tell mypy to step
# aside instead of failing CI on those module-level attribute lookups.
exclude = "^src/utils/watcher\\.py$"

[[tool.mypy.overrides]]
# Belt-and-suspenders: mypy's src-layout sees ``src.utils.watcher`` as the
# module name, so the include pattern uses ``src.utils.watcher``. The
# exclude above uses a path glob.
module = "src.utils.watcher"
ignore_errors = true
